# Деплой parse_fit_bot на VPS при push в main.
# Цепочка: SSH на VPS → git pull → pip install → systemctl restart.
# На сервере в REMOTE_DIR должен быть git-клон репозитория (см. deploy/DEPLOY.md).
# Секреты: DEPLOY_SSH_KEY, VPS_HOST, VPS_USER

name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          grep -q "PRIVATE KEY" ~/.ssh/deploy_key || (echo "::error::DEPLOY_SSH_KEY does not look like a private key. Check the secret." && exit 1)
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Git pull on server
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REMOTE_DIR: /opt/parse_fit_bot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_DIR && sudo -u parsefit /usr/bin/git fetch origin && sudo -u parsefit /usr/bin/git reset --hard origin/main"

      - name: Install deps and restart service
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          REMOTE_DIR: /opt/parse_fit_bot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "cd $REMOTE_DIR && sudo -u parsefit ./venv/bin/pip install -q -r requirements.txt && sudo systemctl restart parse_fit_bot"

      - name: Check service status
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$VPS_USER@$VPS_HOST" \
            "sudo systemctl status parse_fit_bot --no-pager"
